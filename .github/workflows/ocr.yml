name: Run Python OCR

on:
  # รับคำสั่งจาก Google Apps Script
  repository_dispatch:
    types:
      - trigger-from-sheets

  # สำหรับกดทดสอบจากหน้า GitHub Actions
  workflow_dispatch:

permissions:
  contents: read

# ป้องกัน OCR หลายรอบทำงานพร้อมกัน
# หากกดซ้ำ รอบถัดไปจะรอ ไม่แย่ง Google Sheets API quota
concurrency:
  group: weekly-update-python-ocr
  cancel-in-progress: false

jobs:
  run-ocr:
    name: Run OCR
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # 1. โหลดไฟล์จาก Repository
      - name: Checkout repository
        uses: actions/checkout@v5

      # 2. ติดตั้ง Python
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      # 3. ติดตั้ง packages
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      # 4. ตรวจสอบว่ามี Secrets ครบ
      - name: Validate configuration
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          PARENT_FOLDER_ID: ${{ secrets.PARENT_FOLDER_ID }}
          SPREADSHEET_NAME: ${{ secrets.SPREADSHEET_NAME }}
        run: |
          if [ -z "$GOOGLE_CREDENTIALS_JSON" ]; then
            echo "::error::ไม่พบ Repository Secret: GOOGLE_CREDENTIALS_JSON"
            exit 1
          fi

          if [ -z "$PARENT_FOLDER_ID" ]; then
            echo "::error::ไม่พบ Repository Secret: PARENT_FOLDER_ID"
            exit 1
          fi

          if [ -z "$SPREADSHEET_NAME" ]; then
            echo "::error::ไม่พบ Repository Secret: SPREADSHEET_NAME"
            exit 1
          fi

          echo "พบ Secrets ที่จำเป็นครบแล้ว"

      # 5. ตรวจสอบว่า Service Account JSON ถูกต้อง
      - name: Validate Google credentials JSON
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
        run: |
          python -c "
          import json
          import os

          credentials = json.loads(
              os.environ['GOOGLE_CREDENTIALS_JSON']
          )

          required = [
              'type',
              'project_id',
              'private_key',
              'client_email',
              'token_uri'
          ]

          missing = [
              key
              for key in required
              if not credentials.get(key)
          ]

          if missing:
              raise ValueError(
                  'Google credentials ขาดข้อมูล: ' +
                  ', '.join(missing)
              )

          print('Google credentials JSON ถูกต้อง')
          "

      # 6. รัน OCR และบันทึก Google Sheets
      - name: Run OCR
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          PARENT_FOLDER_ID: ${{ secrets.PARENT_FOLDER_ID }}
          SPREADSHEET_NAME: ${{ secrets.SPREADSHEET_NAME }}
          PYTHONUNBUFFERED: "1"
        run: python main.py

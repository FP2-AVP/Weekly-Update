name: Run Python OCR

on:
  # เรียกจาก Google Apps Script
  repository_dispatch:
    types:
      - trigger-from-sheets

  # กดทดสอบด้วยตนเองจากหน้า GitHub Actions
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weekly-update-ocr
  cancel-in-progress: false

jobs:
  run-ocr:
    name: Run OCR
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # 1. ดาวน์โหลดไฟล์ใน Repository มายัง GitHub Runner
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. ติดตั้ง Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      # 3. ติดตั้ง Python packages
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. สร้าง credentials.json จาก GitHub Secret
      - name: Create Google credentials file
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
        run: |
          if [ -z "$GOOGLE_CREDENTIALS_JSON" ]; then
            echo "::error::ไม่พบ GitHub Secret ชื่อ GOOGLE_CREDENTIALS_JSON"
            exit 1
          fi

          printf '%s' "$GOOGLE_CREDENTIALS_JSON" > credentials.json

          python -c "
          import json

          with open('credentials.json', 'r', encoding='utf-8') as file:
              credentials = json.load(file)

          required_fields = [
              'type',
              'project_id',
              'private_key',
              'client_email',
              'token_uri'
          ]

          missing = [
              field
              for field in required_fields
              if not credentials.get(field)
          ]

          if missing:
              raise ValueError(
                  'Google credentials ขาดข้อมูล: ' +
                  ', '.join(missing)
              )

          print('Google credentials JSON is valid')
          "

      # 5. ตรวจสอบ Secrets ที่โปรแกรมจำเป็นต้องใช้
      - name: Validate configuration
        env:
          PARENT_FOLDER_ID: ${{ secrets.PARENT_FOLDER_ID }}
          SPREADSHEET_NAME: ${{ secrets.SPREADSHEET_NAME }}
        run: |
          if [ -z "$PARENT_FOLDER_ID" ]; then
            echo "::error::ไม่พบ GitHub Secret ชื่อ PARENT_FOLDER_ID"
            exit 1
          fi

          if [ -z "$SPREADSHEET_NAME" ]; then
            echo "::error::ไม่พบ GitHub Secret ชื่อ SPREADSHEET_NAME"
            exit 1
          fi

          echo "Required configuration is available"

      # 6. รันโปรแกรม OCR
      - name: Run OCR
        env:
          PARENT_FOLDER_ID: ${{ secrets.PARENT_FOLDER_ID }}
          SPREADSHEET_NAME: ${{ secrets.SPREADSHEET_NAME }}
          GOOGLE_APPLICATION_CREDENTIALS: credentials.json
          PYTHONUNBUFFERED: "1"
        run: python main.py

      # 7. ลบไฟล์ credentials หลังทำงานเสร็จ
      - name: Remove credentials file
        if: always()
        run: rm -f credentials.json
